<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesak AR Banner</title>
    
    <!-- A-Frame library (makes AR easy) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- AR.js library (enables camera tracking) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        /* Info text at the bottom */
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
            font-size: 14px;
        }
        
        #info h2 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        
        #info p {
            margin: 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    
    <!-- AR Scene Container -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Camera -->
        <a-camera position="0 0 0" look-controls wasd-controls></a-camera>
        
        <!-- VESAK BANNER TEXT -->
        <a-text
            value="🪷 Happy Vesak 🪷"
            position="0 2 -3"
            rotation="0 0 0"
            scale="2 2 2"
            color="#FFD700"
            font="https://cdn.jsdelivr.net/npm/three@r128/examples/fonts/helvetiker_bold.typeface.json"
            anchor="center"
        ></a-text>
        
        <!-- Decorative Box (Banner background) -->
        <a-box
            position="0 2 -3.5"
            rotation="0 0 0"
            scale="3 1.5 0.1"
            color="#8B4513"
            opacity="0.8"
        ></a-box>
        
        <!-- Lotus Flower 1 (Left) -->
        <a-sphere
            position="-1.5 1 -3"
            scale="0.5 0.5 0.5"
            color="#FF69B4"
        ></a-sphere>
        
        <!-- Lotus Flower 2 (Right) -->
        <a-sphere
            position="1.5 1 -3"
            scale="0.5 0.5 0.5"
            color="#FF69B4"
        ></a-sphere>
        
        <!-- Lantern decoration (top left) -->
        <a-box
            position="-1 3 -3"
            scale="0.4 0.6 0.4"
            color="#FF6347"
        ></a-box>
        
        <!-- Lantern decoration (top right) -->
        <a-box
            position="1 3 -3"
            scale="0.4 0.6 0.4"
            color="#FF6347"
        ></a-box>
        
        <!-- Light source (makes things glow) -->
        <a-light
            type="point"
            intensity="1"
            position="0 5 0"
            color="white"
        ></a-light>
        
        <!-- Background light -->
        <a-light type="ambient" intensity="0.8"></a-light>
        
    </a-scene>
    
    <!-- Info Text -->
    <div id="info">
        <h2>📱 Vesak AR Banner</h2>
        <p>Point your camera to see the AR decoration!</p>
    </div>

</body>
</html>
